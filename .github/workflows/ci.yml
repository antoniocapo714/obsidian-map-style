name: CI

# Tests on every push. The showcase is published to GitHub Pages only while the
# repository is public (Pages is not available to private repositories on a
# free plan).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build
      # The package installs from GitHub, so dist/ is committed: it must match src/.
      - name: dist/ is current
        run: test -z "$(git status --porcelain -- dist)" || (git status -- dist; echo "Run bun run build and commit dist/"; exit 1)
      - run: bunx vite build demo
        env:
          DEMO_BASE: /obsidian-map-style/
      - if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: test
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
